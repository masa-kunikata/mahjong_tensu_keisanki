<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>符計算 / 点数早見表（Alpine.js 試作）</title>
<style>
  :root{
    --paper:#fbfaf6; --ink:#1b1b1a; --grid:#b9b7ad; --shade:#ececE4;
    --tsumo:#6d6a60; --mark:#ffdc2e; --pen:#c62026; --ctrl:#1b1b1a;
    --rowmark:#fff4c2;
  }
  *{box-sizing:border-box;}
  [x-cloak]{display:none!important;}
  body{margin:0;padding:20px 14px 48px;background:#5a5f57;
    font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;color:var(--ink);}
  .sheet{max-width:1080px;margin:0 auto;background:var(--paper);padding:20px 22px 26px;
    border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.35);}

  /* calculator */
  .calc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;align-items:start;}
  .col{display:flex;flex-direction:column;gap:12px;}
  .cgrp{border:1px solid var(--grid);border-radius:4px;overflow:hidden;background:#fff;}
  .cgrp h2{font-size:11px;letter-spacing:.1em;margin:0;padding:5px 8px;background:var(--shade);
    border-bottom:1px solid var(--grid);}
  .cgrp .body{padding:7px;display:flex;flex-direction:column;gap:5px;}
  .item{display:flex;align-items:stretch;gap:4px;}
  .item .add{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;
    border:1px solid var(--grid);background:#fff;border-radius:3px;padding:6px 8px;cursor:pointer;
    font-family:inherit;font-size:12.5px;color:var(--ink);line-height:1;text-align:left;
    transition:background .1s,border-color .1s;}
  .item .add:hover{border-color:var(--ink);background:#fdfbe9;}
  .item .add em{font-style:normal;font-weight:700;color:#8a877c;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .item.active .add{background:#fff2c2;border-color:var(--pen);}
  .item.active .add em{color:var(--pen);}
  .item .cnt{min-width:30px;display:flex;align-items:center;justify-content:center;font-size:12px;
    font-weight:700;color:var(--pen);font-variant-numeric:tabular-nums;}
  .item.zero .cnt{color:#c9c7bd;}
  .item .sub{width:26px;border:1px solid var(--grid);background:#fff;border-radius:3px;cursor:pointer;
    font-size:15px;line-height:1;color:#8a877c;font-family:inherit;}
  .item .sub:hover{border-color:var(--ink);color:var(--ink);}
  .item.zero .sub{opacity:.35;pointer-events:none;}
  .item.maxed .add{opacity:.35;pointer-events:none;}
  .tog{display:flex;flex-wrap:wrap;gap:5px;}
  .tog button{border:1px solid var(--grid);background:#fff;border-radius:3px;padding:6px 8px;cursor:pointer;
    font-family:inherit;font-size:12px;color:var(--ink);line-height:1;transition:background .1s,border-color .1s;}
  .tog button:hover{border-color:var(--ink);}
  .tog button.on{background:var(--ctrl);color:#fff;border-color:var(--ctrl);}
  .tog button em{font-style:normal;color:#b9b7ad;font-size:11px;margin-left:3px;}
  .tog button.on em{color:#d7d5c8;}

  /* result + lookup */
  .result{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:0 0 18px;
    border:1px solid #2a2a28;border-radius:4px;background:#fff;overflow:hidden;}
  .half{padding:12px 16px;}
  .fu-half{display:flex;gap:18px;border-right:1px solid var(--grid);}
  .fu-main{flex-shrink:0;display:flex;flex-direction:column;justify-content:center;}
  .fu-main .line{display:flex;align-items:baseline;gap:4px;}
  .fu-main .n{font-size:40px;font-weight:800;color:var(--pen);font-variant-numeric:tabular-nums;line-height:1;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;}
  .fu-main .u{font-size:16px;font-weight:700;}
  .fu-main .sum{font-size:12px;color:#8a877c;margin-top:5px;}
  .brk{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:12.5px;min-width:150px;}
  .brk .bl{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--grid);padding:3px 0;}
  .brk .bl:last-child{border-bottom:0;}
  .brk .bl .v{font-weight:700;color:#55534a;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .brk.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 10px;}
  .brk.grid4 .bl{flex-direction:column;align-items:flex-start;gap:0;border-bottom:0;padding:2px 0;}
  .brk.grid4 .bl span:first-child{font-size:10px;color:#8a877c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .brk.grid4 .bl .v{font-size:12px;}
  @media (max-width:680px){.brk.grid4{grid-template-columns:repeat(2,1fr);}}
  .han-half{display:flex;flex-direction:column;justify-content:center;padding-right:72px;}
  .han-half .hh-hint{font-size:12.5px;color:#8a877c;}
  .han-half .hh-lab{font-size:10px;letter-spacing:.14em;color:#8a877c;margin-bottom:3px;}
  .han-half .hh-top{display:flex;align-items:baseline;gap:8px;}
  .han-half .hh-big{font-size:30px;font-weight:800;color:var(--ink);line-height:1;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;}
  .han-half .hh-role{font-size:13px;font-weight:700;color:#55534a;}
  .han-half .hh-pt{font-size:14px;margin-top:6px;color:#55534a;}
  .han-half .hh-pt .pt{font-weight:800;color:var(--pen);font-variant-numeric:tabular-nums;}
  .reset{position:absolute;top:8px;right:10px;z-index:2;border:1px solid var(--grid);background:#fff;
    border-radius:3px;padding:5px 11px;cursor:pointer;font-family:inherit;font-size:11px;color:var(--ink);}
  .reset:hover{border-color:var(--pen);color:var(--pen);}
  @media (max-width:680px){.result{grid-template-columns:1fr;}
    .fu-half{border-right:0;border-bottom:1px solid var(--grid);}
    .han-half{padding-right:16px;}}

  /* tables */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.main{border-collapse:collapse;width:100%;min-width:760px;}
  table.main th,table.main td{border:1px solid var(--grid);text-align:center;
    font-variant-numeric:tabular-nums;padding:5px 4px;}
  table.main thead .side{background:var(--shade);font-size:11px;padding:5px;}
  table.main thead .hn{background:#f4f3ec;font-size:11px;font-weight:700;color:#44423a;width:8.2%;}
  table.main .fucol{background:var(--shade);font-weight:800;font-size:14px;width:44px;}
  table.main td .r{display:block;font-weight:700;font-size:13px;line-height:1.15;}
  table.main td .t{display:block;font-size:10px;color:var(--tsumo);line-height:1.1;margin-top:1px;}
  table.main td.man{font-weight:700;color:#333;background:#f7f6ef;}
  table.main td.na{color:#b3b1a6;}
  .edge{border-left:2px solid #2a2a28!important;}
  table.main tr.rowhit td,table.main tr.rowhit th{background:var(--rowmark);}
  table.main tr.rowhit td.man{background:#fdeeb0;}
  table.main tr.rowhit .fucol{background:var(--mark);box-shadow:inset 0 0 0 2px var(--pen);}
  th.pick{cursor:pointer;}
  th.pick:hover{outline:2px solid var(--pen);outline-offset:-2px;background:#fdfbe9;}
  th.thhit{background:var(--mark)!important;color:var(--ink)!important;box-shadow:inset 0 0 0 3px var(--pen);}
  td.cellhit{background:var(--mark)!important;box-shadow:inset 0 0 0 3px var(--pen)!important;}
  td.cellhit .t{color:#7a3a12!important;}

  table.fixed{border-collapse:collapse;width:100%;min-width:760px;margin-top:14px;}
  table.fixed th,table.fixed td{border:1px solid var(--grid);text-align:center;
    font-variant-numeric:tabular-nums;padding:5px 4px;font-size:12px;width:8.2%;}
  table.fixed thead th{background:var(--shade);font-size:10.5px;}
  table.fixed .han-row td{font-size:9.5px;color:#8a877c;background:#f7f6ef;}
  table.fixed .midlab{background:var(--ctrl);color:#fff;font-weight:700;font-size:11px;width:44px;}
  table.fixed td .r{display:block;font-weight:800;font-size:13px;}
  table.fixed td .t{display:block;font-size:10px;color:var(--tsumo);}

  table.main.collapsed tr.hifu{display:none;}
  .toggle70{display:block;width:100%;margin-top:-1px;padding:7px 10px;cursor:pointer;
    border:1px solid var(--grid);border-top:0;background:#f4f3ec;color:#55534a;
    font-family:inherit;font-size:12px;letter-spacing:.04em;border-radius:0 0 3px 3px;
    transition:background .1s;}
  .toggle70:hover{background:#eceadf;color:var(--ink);}

  .foot{font-size:10.5px;color:#8a877c;margin-top:12px;line-height:1.7;}
  .note{font-size:11px;color:#fff;background:#3a6b4a;padding:6px 10px;border-radius:3px;margin-bottom:10px;max-width:1080px;margin-left:auto;margin-right:auto;}
  @media (max-width:680px){.calc{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<p class="note">試作版（Alpine.jsで状態管理を書き換え。CDN読み込みのため今はオフラインでは動きません）</p>

<div class="sheet" x-data="appData()" x-init="$watch('fuRow', (v,o)=>{ if(v>=70 && o<70) expanded=true })">

  <div class="calc">
    <div class="col">
      <div class="cgrp"><h2>上がり方</h2><div class="body"><div class="tog">
        <template x-for="a in AGARI" :key="a.k">
          <button :class="{on: agari===a.k && !special}" @click="pickAgari(a.k)" x-html="a.l+'&lt;em&gt;+'+a.fu+'&lt;/em&gt;'"></button>
        </template>
      </div></div></div>
      <div class="cgrp"><h2>特例（押すと固定）</h2><div class="body"><div class="tog">
        <template x-for="s in SPECIAL" :key="s.k">
          <button :class="{on: special===s.k}" @click="pickSpecial(s.k)" x-html="s.l+'&lt;em&gt;'+s.fixed+'符&lt;/em&gt;'"></button>
        </template>
      </div></div></div>
    </div>
    <div class="cgrp"><h2>面子の符（中張）</h2><div class="body">
      <template x-for="it in meldsC" :key="it.id">
        <div class="item" :class="{zero: counts[it.id]===0, active: counts[it.id]>0 && !special, maxed: meldTotal>=4}">
          <button class="add" @click="addMeld(it.id)" x-html="it.l+'&lt;em&gt;+'+it.fu+'&lt;/em&gt;'"></button>
          <span class="cnt" x-text="'×'+counts[it.id]"></span>
          <button class="sub" @click="subMeld(it.id)">−</button>
        </div>
      </template>
    </div></div>
    <div class="cgrp"><h2>面子の符（么九）</h2><div class="body">
      <template x-for="it in meldsT" :key="it.id">
        <div class="item" :class="{zero: counts[it.id]===0, active: counts[it.id]>0 && !special, maxed: meldTotal>=4}">
          <button class="add" @click="addMeld(it.id)" x-html="it.l+'&lt;em&gt;+'+it.fu+'&lt;/em&gt;'"></button>
          <span class="cnt" x-text="'×'+counts[it.id]"></span>
          <button class="sub" @click="subMeld(it.id)">−</button>
        </div>
      </template>
    </div></div>
    <div class="col">
      <div class="cgrp"><h2>頭の符</h2><div class="body"><div class="tog">
        <template x-for="h in HEAD" :key="h.k">
          <button :class="{on: headSel===h.k && !special}" @click="pickHead(h.k)" x-html="h.l + (h.fu>0 ? ('&lt;em&gt;+'+h.fu+'&lt;/em&gt;') : '&lt;em&gt;0&lt;/em&gt;')"></button>
        </template>
      </div></div></div>
      <div class="cgrp"><h2>待ちの符</h2><div class="body"><div class="tog">
        <template x-for="w in WAIT" :key="w.k">
          <button :class="{on: waitSel===w.k && !special}" @click="pickWait(w.k)" x-html="w.l + (w.fu>0 ? ('&lt;em&gt;+'+w.fu+'&lt;/em&gt;') : '&lt;em&gt;0&lt;/em&gt;')"></button>
        </template>
      </div></div></div>
    </div>
  </div>

  <div class="result">
    <button class="reset" @click="reset()">リセット</button>
    <div class="half fu-half">
      <div class="fu-main">
        <div class="line"><span class="n" x-text="fuResult.fu"></span><span class="u">符</span></div>
        <div class="sum" x-text="fuResult.fixed ? '（固定）' : ('（合計 '+fuResult.sum+'符）')"></div>
      </div>
      <div class="brk" :class="{grid4: fuResult.lines.length>=3}">
        <template x-for="(l,idx) in fuResult.lines" :key="idx">
          <div class="bl"><span x-text="l.label + (l.n>1 ? (' ×'+l.n) : '')"></span><span class="v" x-text="l.fu+'符'"></span></div>
        </template>
      </div>
    </div>
    <div class="half han-half">
      <div class="hh-hint" x-show="!hanPanel.show" x-cloak>上の見出し（翻）をクリックして選択</div>
      <div x-show="hanPanel.show" x-cloak>
        <div class="hh-lab">選択したハン</div>
        <div class="hh-top"><span class="hh-big" x-text="hanPanel.big"></span><span class="hh-role" x-text="hanPanel.roleJP"></span></div>
        <div class="hh-pt" x-html="hanPanel.ptHtml"></div>
      </div>
    </div>
  </div>

  <div class="tbl-wrap"><table class="main" :class="{collapsed: !expanded}">
    <thead>
      <tr>
        <th class="side" colspan="5">親家（下段＝子1人の支払い）</th>
        <th class="fucol" rowspan="2">符</th>
        <th class="side" colspan="5">子家（下段＝子／親）</th>
      </tr>
      <tr>
        <template x-for="han in [5,4,3,2,1]" :key="'dh'+han">
          <th class="hn pick" :class="{thhit: isHeaderHit('dealer', han===5?'rank':'han', han===5?'mangan':han)}"
              @click="pickCell('dealer', han===5?'rank':'han', han===5?'mangan':han)" x-text="han+'翻'"></th>
        </template>
        <template x-for="(han,i) in [1,2,3,4,5]" :key="'ch'+han">
          <th class="hn pick" :class="{edge:i===0, thhit: isHeaderHit('child', han===5?'rank':'han', han===5?'mangan':han)}"
              @click="pickCell('child', han===5?'rank':'han', han===5?'mangan':han)" x-text="han+'翻'"></th>
        </template>
      </tr>
    </thead>
    <tbody>
      <template x-for="fu in FU" :key="fu">
        <tr :class="{hifu: fu>=70, rowhit: fu===fuRow}">
          <template x-for="han in [5,4,3,2,1]" :key="'dc'+fu+'-'+han">
            <td :class="{man: han===5, cellhit: han!==5 && fu===fuRow && isHeaderHit('dealer','han',han)}"
                x-html="han===5 ? '満貫' : cellHTML(calc(fu, han, 'dealer'))"></td>
          </template>
          <td class="fucol" x-text="fu"></td>
          <template x-for="(han,i) in [1,2,3,4,5]" :key="'cc'+fu+'-'+han">
            <td :class="{man: han===5, edge:i===0, cellhit: han!==5 && fu===fuRow && isHeaderHit('child','han',han)}"
                x-html="han===5 ? '満貫' : cellHTML(calc(fu, han, 'child'))"></td>
          </template>
        </tr>
      </template>
    </tbody>
  </table></div>
  <button class="toggle70" @click="expanded=!expanded" x-text="expanded ? '70符以上を隠す ▲' : '70符以上を表示 ▼'"></button>

  <div class="tbl-wrap"><table class="fixed">
    <thead>
      <tr>
        <template x-for="k in dO" :key="'dr'+k">
          <th class="pick" :class="{thhit: isHeaderHit('dealer','rank',k)}" @click="pickCell('dealer','rank',k)" x-text="RANK[k][0]"></th>
        </template>
        <th rowspan="3" class="midlab">5翻<br>以上</th>
        <template x-for="k in cO" :key="'cr'+k">
          <th class="pick" :class="{thhit: isHeaderHit('child','rank',k)}" @click="pickCell('child','rank',k)" x-text="RANK[k][0]"></th>
        </template>
      </tr>
      <tr class="han-row">
        <template x-for="k in dO" :key="'drr'+k"><td x-text="RANK[k][1]"></td></template>
        <template x-for="k in cO" :key="'crr'+k"><td x-text="RANK[k][1]"></td></template>
      </tr>
      <tr>
        <template x-for="k in dO" :key="'drc'+k">
          <td :class="{cellhit: isHeaderHit('dealer','rank',k)}">
            <span class="r" x-text="fmt(FIXED[k].dealer.r)"></span><span class="t" x-text="FIXED[k].dealer.t"></span>
          </td>
        </template>
        <template x-for="(k,i) in cO" :key="'crc'+k">
          <td :class="{edge: i===0, cellhit: isHeaderHit('child','rank',k)}">
            <span class="r" x-text="fmt(FIXED[k].child.r)"></span><span class="t" x-text="FIXED[k].child.t"></span>
          </td>
        </template>
      </tr>
    </thead>
  </table></div>

  <p class="foot">
    副底20＋各要素を合計し10符単位で切り上げ。平和ツモ（20符）・七対子（25符）は上の特例ボタンで固定。<br>
    親：下段＝子1人の支払い ／ 子：下段＝子の払い／親の払い。5翻の列＝満貫（点数は下段の表を参照）。
  </p>
</div>

<script>
const FU=[20,25,30,40,50,60,70,80,90,100,110];
const ceil100=n=>Math.ceil(n/100)*100;
const fmt=n=>n.toLocaleString('ja-JP');
function calc(fu,han,role){
  if((fu===20||fu===25)&&han===1) return null;
  const base=fu*Math.pow(2,2+han);
  if(base>=2000) return 'man';
  if(role==='dealer') return {ron:ceil100(base*6),tsumo:fmt(ceil100(base*2))};
  return {ron:ceil100(base*4),tsumo:fmt(ceil100(base*1))+'/'+fmt(ceil100(base*2))};
}
function cellHTML(v){
  if(v===null) return '<span class="r na">—</span>';
  if(v==='man') return '満貫';
  return `<span class="r">${fmt(v.ron)}</span><span class="t">${v.tsumo}</span>`;
}
const RANK={mangan:['満貫','5翻'],hane:['跳満','6～7翻'],bai:['倍満','8～10翻'],sanbai:['三倍満','11翻～'],yakuman:['役満','役満']};
const FIXED={mangan:{dealer:{r:12000,t:'4000'},child:{r:8000,t:'2000/4000'}},
  hane:{dealer:{r:18000,t:'6000'},child:{r:12000,t:'3000/6000'}},
  bai:{dealer:{r:24000,t:'8000'},child:{r:16000,t:'4000/8000'}},
  sanbai:{dealer:{r:36000,t:'12000'},child:{r:24000,t:'6000/12000'}},
  yakuman:{dealer:{r:48000,t:'16000'},child:{r:32000,t:'8000/16000'}}};

const AGARI=[{k:'menzenRon',l:'面前ロン',fu:10},{k:'ron',l:'ロン(鳴き)',fu:0},{k:'kuipinfu',l:'食い平和',fu:10},{k:'tsumo',l:'ツモ',fu:2}];
const MELDS=[{id:'mk_c',l:'明刻 中張',fu:2},{id:'mk_t',l:'明刻 么九',fu:4},
  {id:'ak_c',l:'暗刻 中張',fu:4},{id:'ak_t',l:'暗刻 么九',fu:8},
  {id:'mg_c',l:'明槓 中張',fu:8},{id:'mg_t',l:'明槓 么九',fu:16},
  {id:'ag_c',l:'暗槓 中張',fu:16},{id:'ag_t',l:'暗槓 么九',fu:32}];
const HEAD=[{k:'none',l:'クリア',fu:0},{k:'y1',l:'役牌の頭',fu:2},{k:'y2',l:'連風牌の頭',fu:4}];
const WAIT=[{k:'none',l:'クリア',fu:0},{k:'kan',l:'カンチャン',fu:2},{k:'pen',l:'ペンチャン',fu:2},{k:'tan',l:'タンキ',fu:2}];
const SPECIAL=[{k:'pinfuTsumo',l:'平和ツモ',fixed:20},{k:'chiitoi',l:'七対子',fixed:25}];
const DEALER_RANKS=['yakuman','sanbai','bai','hane','mangan'], CHILD_RANKS=['mangan','hane','bai','sanbai','yakuman'];

function appData(){
  return {
    // static data exposed for templates (Alpine expressions can't see top-level const bindings)
    AGARI, SPECIAL, HEAD, WAIT, FU, RANK, FIXED, dO: DEALER_RANKS, cO: CHILD_RANKS,
    fmt, calc, cellHTML,

    // state
    agari:'menzenRon', special:null,
    counts: Object.fromEntries(MELDS.map(m=>[m.id,0])),
    headSel:'none', waitSel:'none',
    selRole:null, selKind:null, selVal:null,
    expanded:false,

    get meldsC(){ return MELDS.filter(m=>m.id.endsWith('_c')); },
    get meldsT(){ return MELDS.filter(m=>m.id.endsWith('_t')); },
    get meldTotal(){ return MELDS.reduce((s,m)=>s+this.counts[m.id],0); },

    pickAgari(k){ this.agari=k; this.special=null; },
    pickSpecial(k){ this.special = this.special===k ? null : k; },
    addMeld(id){ if(this.meldTotal>=4) return; this.counts[id]++; this.special=null; },
    subMeld(id){ if(this.counts[id]>0) this.counts[id]--; },
    pickHead(k){ this.headSel=k; this.special=null; },
    pickWait(k){ this.waitSel=k; this.special=null; },
    pickCell(role,kind,val){ this.selRole=role; this.selKind=kind; this.selVal=val; },
    reset(){
      MELDS.forEach(m=>this.counts[m.id]=0);
      this.agari='menzenRon'; this.special=null;
      this.headSel='none'; this.waitSel='none';
      this.selRole=null; this.selKind=null; this.selVal=null;
      this.expanded=false;
    },

    get fuResult(){
      if(this.special){
        const s=SPECIAL.find(x=>x.k===this.special);
        return {fu:s.fixed, sum:s.fixed, fixed:true, lines:[{label:s.l, fu:s.fixed}]};
      }
      const ag=AGARI.find(a=>a.k===this.agari);
      let raw=20; const lines=[{label:'副底', fu:20}];
      if(ag.fu>0){raw+=ag.fu; lines.push({label:ag.l, fu:ag.fu});}
      MELDS.forEach(it=>{const n=this.counts[it.id]; if(n>0){const add=it.fu*n; raw+=add; lines.push({label:it.l, fu:add, n});}});
      const h=HEAD.find(x=>x.k===this.headSel); if(h&&h.fu>0){raw+=h.fu; lines.push({label:h.l, fu:h.fu});}
      const w=WAIT.find(x=>x.k===this.waitSel); if(w&&w.fu>0){raw+=w.fu; lines.push({label:w.l, fu:w.fu});}
      return {fu:Math.ceil(raw/10)*10, sum:raw, lines};
    },

    get fuRow(){
      let f=this.fuResult.fu;
      if(!FU.includes(f)) f=Math.min(110, Math.max(20,f));
      return f;
    },

    isHeaderHit(role,kind,val){
      return this.selRole===role && this.selKind===kind && this.selVal===val;
    },

    get hanPanel(){
      if(this.selKind===null) return {show:false};
      const roleJP = this.selRole==='dealer' ? '親家' : '子家';
      let big, ptHtml;
      if(this.selKind==='rank'){
        const v=FIXED[this.selVal][this.selRole];
        big=RANK[this.selVal][0];
        ptHtml=`ロン <span class="pt">${fmt(v.r)}</span> ／ ツモ <span class="pt">${v.t}</span>`;
      } else {
        big=this.selVal+'翻';
        const r=calc(this.fuRow, this.selVal, this.selRole);
        if(r===null) ptHtml=`${this.fuRow}符 → 該当なし`;
        else if(r==='man'){
          const v=FIXED.mangan[this.selRole];
          ptHtml=`${this.fuRow}符・満貫　ロン <span class="pt">${fmt(v.r)}</span> ／ ツモ <span class="pt">${v.t}</span>`;
        } else {
          ptHtml=`${this.fuRow}符　ロン <span class="pt">${fmt(r.ron)}</span> ／ ツモ <span class="pt">${r.tsumo}</span>`;
        }
      }
      return {show:true, big, roleJP, ptHtml};
    }
  };
}
</script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
